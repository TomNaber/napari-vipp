name: Build ImarisWriter wheel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native/napari_vipp_imaris/**"
      - ".github/workflows/imaris-wheel.yml"

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          brew install hdf5 lz4
          python -m pip install --upgrade build delocate
      - name: Build and repair wheel
        env:
          CMAKE_ARGS: -DHDF5_ROOT=/opt/homebrew/opt/hdf5 -DLZ4_ROOT=/opt/homebrew/opt/lz4
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          python -m build --wheel native/napari_vipp_imaris
          delocate-wheel --require-archs arm64 -v -w wheelhouse native/napari_vipp_imaris/dist/*.whl
      - name: Smoke test installed wheel
        run: |
          python -m pip install wheelhouse/*.whl
          python native/napari_vipp_imaris/smoke_test.py
      - name: Round-trip through VIPP and BioFormats
        run: |
          python -m pip install -e ".[bioformats]" pytest
          python -m pytest -q src/napari_vipp/_tests/test_imaris_io.py
      - uses: actions/upload-artifact@v4
        with:
          name: napari-vipp-imaris-macos-arm64
          path: wheelhouse/*.whl
